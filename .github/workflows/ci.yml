name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.package_name }} tests py${{ matrix.python_version }} ${{ matrix.django_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package_name: ["providerkit", "django-providerkit"]
        python_version: ["3.10", "3.11", "3.12"]
        django_version: ["", "5.0.*", "5.1.*", "5.2.*"]
        exclude:
          - package_name: providerkit
            django_version: "5.0.*"
          - package_name: providerkit
            django_version: "5.1.*"
          - package_name: providerkit
            django_version: "5.2.*"
          - package_name: django-providerkit
            django_version: ""
        include:
          - package_name: providerkit
            working_directory: python-providerkit
            install_dependencies: |
              python -m pip install "clicommands>=0.1.1"
              python -m pip install -e ".[test]"
            test_command: python -m pytest
          - package_name: django-providerkit
            working_directory: django-providerkit
            install_dependencies: |
              python -m pip install build
              python -m pip install "clicommands>=0.1.1"
              python -m pip install -e ../python-providerkit
              python -m pip install -e ".[test]"
            test_command: python manage.py test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install dependencies
        working-directory: ${{ matrix.working_directory }}
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install_dependencies }}

      - name: Install Django
        if: ${{ matrix.package_name == 'django-providerkit' }}
        working-directory: ${{ matrix.working_directory }}
        run: python -m pip install "Django==${{ matrix.django_version }}"

      - name: Django system check
        if: ${{ matrix.package_name == 'django-providerkit' }}
        working-directory: ${{ matrix.working_directory }}
        run: python manage.py check

      - name: Run tests
        working-directory: ${{ matrix.working_directory }}
        run: ${{ matrix.test_command }}

  build:
    name: Build ${{ matrix.package_name }}
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: providerkit
            working_directory: python-providerkit
            install_dependencies: |
              python -m pip install "clicommands>=0.1.1"
          - package_name: django-providerkit
            working_directory: django-providerkit
            install_dependencies: |
              python -m pip install "Django==5.2.*"
              python -m pip install "clicommands>=0.1.1"
              python -m pip install -e ../python-providerkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        working-directory: ${{ matrix.working_directory }}
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install_dependencies }}
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
